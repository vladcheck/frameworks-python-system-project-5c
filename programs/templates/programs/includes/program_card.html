<article class="card">
  <div class="card-body">
    <h5 class="card-title">{{ program.name|default:"Без названия" }}</h5>
    <p class="card-text">{{ program.duration }} мин — {{ program.age_limit }}+</p>
    <a href="{% url 'programs:program_detail' program.id %}">Подробнее</a>
  </div>
</article>
