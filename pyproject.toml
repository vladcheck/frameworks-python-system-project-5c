[project]
name = "frameworks-python-system-project-3c"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["django>=5.2.17,<6", "flake8>=7.3.0", "pypdf>=6.18.0"]

[dependency-groups]
dev = ["pre-commit>=4.6.2", "pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/settings.py", "concerty/asgi.py", "concerty/wsgi.py"]
