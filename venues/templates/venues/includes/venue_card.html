<article class="card">
  <div class="card-body">
    <h5 class="card-title">{{ venue.name|default:"Без названия" }}</h5>
    <p class="card-text">{{ venue.city }} — {{ venue.capacity }} мест</p>
    <p class="card-text mb-2">Концертов: {{ venue.concert_count }}</p>
    <a href="{{ venue.get_absolute_url }}">Подробнее</a>
  </div>
</article>
